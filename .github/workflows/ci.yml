# CI for agentbox. These three steps are the same stages as the `check` gate:
#   - formatting for Just, Nix, and implementation-owned Markdown
#   - ShellCheck, Markdown lint, YAML lint, and Dockerfile lint
#   - unit tests and Nix parsing
#
# `format` applies formatters locally and rejects tracked changes in CI. The
# equivalent local probe is `GITHUB_ACTIONS=true just format` from a clean
# plain Git checkout.
# The full image build + tests/smoke.sh need a Sysbox-equipped host with nested
# Docker, so they run out-of-band (ab start && bash tests/smoke.sh), not here.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: repository gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3
        with:
          just-version: '1.57.0'

      - uses: astral-sh/setup-uv@v6

      - name: Run formatters
        run: just --no-deps format

      - name: Run linters
        run: just --no-deps lint

      - name: Run tests
        run: just --no-deps test
